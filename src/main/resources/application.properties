# Application name shown in logs and by Spring Actuator (if enabled)
spring.application.name=tutoring-manager-server
# HTTP port where the API server listens
server.port=8080

## JPA/Hibernate Configuration
# SQL dialect Hibernate should use when generating SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Recreate schema on each startup (good for dev/demo, not production)
spring.jpa.hibernate.ddl-auto=create
# Disable SQL statement logging in console output
spring.jpa.show-sql=false
# Pretty-format SQL output when SQL logging is enabled
spring.jpa.properties.hibernate.format_sql=true

## H2 Database Configuration
# In-memory H2 database URL (data resets when app stops)
spring.datasource.url=jdbc:h2:mem:tutoring_db
# JDBC driver class used to connect to H2
spring.datasource.driverClassName=org.h2.Driver
# H2 database username
spring.datasource.username=sa
# H2 database password (empty by default for local dev)
spring.datasource.password=

## H2 Console (Optional - for debugging)
# Enable the browser-based H2 console endpoint
spring.h2.console.enabled=true
# URL path to access the H2 console
spring.h2.console.path=/h2-console

## JWT
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdG9rZW5zIHRoYXQgaXMgYXQgbGVhc3QgMjU2IGJpdHM=
