# Application name shown in logs and by Spring Actuator (if enabled)
spring.application.name=tutoring-manager-server
# HTTP port where the API server listens
server.port=8080

## JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Update schema on startup without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/tutoring_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tutoring_user
spring.datasource.password=tutoring_pass

